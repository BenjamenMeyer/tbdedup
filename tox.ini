[tox]
minversion=3.21
envlist={py3.12,py3.13,py3.14},pep8
skip_missing_interpreters=True

[testenv]
basepython = 
    py3.12: python3.12
    py3.13: python3.13
    py3.14: python3.14
    py3: python3
    pep8: python3

deps = 
    py3.12,py3.13,py3.14,py3: -r{toxinidir}/tools/test-requirements.txt
    pep8: -r{toxinidir}/tools/pep8-requirements.txt

commands = 
    py3.12,py3.13,py3.14,py3: pytest {toxinidir}/tests --cov-config=.coveragerc --cov=thunderbirddedup {posargs}
    pep8: pycodestyle --exclude=.tox,dist,*env*,.*env*,build --ignore=E128,W504

setenv=
    py3.12,py3.13,py3.14,py3: VIRTUAL_ENV={envdir} LC_ALL = en_US.utf-8 QT_QPA_PLATFORM = offscreen

[pycodestyle]
ignore = E128,W504
max-line-length = 200
statistics = True

[tox]
minversion=3.21
envlist={py3.14},pep8
skip_missing_interpreters=True

[testenv]
basepython = 
    py3.14: python3.14
    pep8: python3

deps = 
    py3.14: -r{toxinidir}/tools/test-requirements.txt
    pep8: -r{toxinidir}/tools/pep8-requirements.txt

commands = 
    py3.14: pytest {toxinidir}/tests --cov-config=.coveragerc --cov=thunderbirddedup {posargs}
    pep8: pycodestyle --exclude=.tox,dist,*env*,.*env*,build --ignore=E128,W504

setenv=
    py3.14: VIRTUAL_ENV={envdir} LC_ALL = en_US.utf-8

[pycodestyle]
ignore = E128,W504
max-line-length = 200
statistics = True
